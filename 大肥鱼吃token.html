<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{

  /* #stage 是逻辑 960x540 的等比缩放容器：--u = 1 逻辑像素在屏幕上的实际尺寸 */

    position:absolute;left:50%;top:50%;transform-origin:50% 50%;
    --u:1px;
    overflow:hidden;
    border-radius:calc(10 * var(--u));
    box-shadow:0 0 calc(60 * var(--u)) rgba(0,0,0,.75), 0 0 0 calc(1 * var(--u)) rgba(120,170,255,.12);
    background:#05070f;
    will-change:transform;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .layer{position:absolute;inset:0;display:none;pointer-events:none}
  .layer.on{display:block}

  /* ---------- 主菜单 ---------- */
  #uiMenu{display:none;flex-direction:column;justify-content:space-between;align-items:center;
    padding:calc(34 * var(--u)) calc(30 * var(--u)) calc(30 * var(--u))}
  #uiMenu.on{display:flex}
  .menu-top{text-align:center}
  .title{
    font-size:calc(58 * var(--u));line-height:1.05;font-weight:900;letter-spacing:calc(2 * var(--u));
    background:linear-gradient(180deg,#ffffff 0%,#a9c6ff 45%,#4D6BFE 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 calc(18 * var(--u)) rgba(77,107,254,.75));
  }
  .subtitle{margin-top:calc(8 * var(--u));font-size:calc(17 * var(--u));letter-spacing:calc(3 * var(--u));
    color:#9fb6e6;text-shadow:0 0 calc(12 * var(--u)) rgba(77,107,254,.5)}
  .menu-bottom{display:flex;flex-direction:column;align-items:center;gap:calc(14 * var(--u));width:100%}
  .best{font-size:calc(16 * var(--u));color:#8ea6d6;letter-spacing:calc(.6 * var(--u))}
  .best b{color:#cfe0ff;font-weight:700}
  .tiphint{font-size:calc(14 * var(--u));color:#6a7fa8}

  /* ---------- 按钮 ---------- */
  .btnrow{display:flex;gap:calc(16 * var(--u));flex-wrap:wrap;justify-content:center}
  .btn{
    pointer-events:auto;cursor:pointer;border:0;outline:0;
    font-family:inherit;font-weight:700;color:#dbe7ff;
    font-size:calc(19 * var(--u));letter-spacing:calc(1.5 * var(--u));
    padding:calc(13 * var(--u)) calc(30 * var(--u));
    border-radius:calc(14 * var(--u));
    background:linear-gradient(180deg,rgba(48,72,150,.92),rgba(22,34,78,.92));
    box-shadow:inset 0 0 0 calc(1.5 * var(--u)) rgba(140,180,255,.35), 0 calc(4 * var(--u)) calc(16 * var(--u)) rgba(0,0,0,.45);
    transition:transform .08s ease, filter .15s ease;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.18)}
  .btn:active{transform:translateY(calc(2 * var(--u))) scale(.985)}
  .btn.primary{
    background:linear-gradient(180deg,#6d8cff,#3350d8);color:#fff;
    box-shadow:inset 0 0 0 calc(1.5 * var(--u)) rgba(200,220,255,.55), 0 calc(6 * var(--u)) calc(22 * var(--u)) rgba(77,107,254,.55);
  }
  .btn.ghost{background:linear-gradient(180deg,rgba(30,42,86,.7),rgba(16,24,52,.7));color:#a9bde6}

  /* ---------- 弹窗面板 ---------- */
  .panel{
    pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(520 * var(--u));
    padding:calc(28 * var(--u)) calc(30 * var(--u)) calc(26 * var(--u));
    border-radius:calc(22 * var(--u));
    background:linear-gradient(180deg,rgba(14,22,48,.94),rgba(8,12,30,.96));
    box-shadow:inset 0 0 0 calc(1.5 * var(--u)) rgba(120,160,255,.28), 0 calc(20 * var(--u)) calc(60 * var(--u)) rgba(0,0,0,.6);
    backdrop-filter:blur(calc(6 * var(--u)));
    text-align:center;
  }
  .panel h2{font-size:calc(30 * var(--u));letter-spacing:calc(2 * var(--u));margin-bottom:calc(14 * var(--u));
    background:linear-gradient(180deg,#ffffff,#9fc0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .col{display:flex;flex-direction:column;gap:calc(12 * var(--u));align-items:stretch;margin-top:calc(6 * var(--u))}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(10 * var(--u));margin:calc(6 * var(--u)) 0 calc(12 * var(--u))}
  .stats > div{background:rgba(255,255,255,.05);border-radius:calc(12 * var(--u));padding:calc(10 * var(--u)) calc(12 * var(--u));
    display:flex;flex-direction:column;gap:calc(3 * var(--u));align-items:center}
  .stats span{font-size:calc(13 * var(--u));color:#8ea6d6;letter-spacing:calc(.8 * var(--u))}
  .stats b{font-size:calc(26 * var(--u));color:#eaf2ff;font-weight:800}
  .record{font-size:calc(17 * var(--u));font-weight:800;letter-spacing:calc(2 * var(--u));color:#ffd76a;
    text-shadow:0 0 calc(14 * var(--u)) rgba(255,190,60,.8);margin-bottom:calc(10 * var(--u));height:calc(22 * var(--u))}

  /* ---------- 右上角图标按钮 ---------- */
  .icon-btn{
    position:absolute;top:calc(14 * var(--u));width:calc(42 * var(--u));height:calc(42 * var(--u));
    border-radius:calc(13 * var(--u));cursor:pointer;pointer-events:auto;
    border:calc(1.5 * var(--u)) solid rgba(150,185,255,.28);
    background:rgba(10,18,40,.6);color:#dbe7ff;
    font-size:calc(15 * var(--u));font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(calc(4 * var(--u)));
    transition:filter .15s ease, transform .08s ease;
  }
  .icon-btn:hover{filter:brightness(1.25)}
  .icon-btn:active{transform:scale(.94)}
  #btnPause{right:calc(68 * var(--u))}
  #btnMute{right:calc(14 * var(--u))}
  #btnPause{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- 主菜单 -->
  <div class="layer" id="uiMenu">
    <div class="menu-top">
      <h1 class="title">大肥鱼吃 Token</h1>
      <p class="subtitle">蓝色大肥鱼 · 缓存热跑酷</p>
    </div>
    <div class="menu-bottom">
      <div class="btnrow">
        <button class="btn primary" id="btnStart">开始游戏</button>
        <button class="btn" id="btnHow">玩法说明</button>
      </div>
      <p class="best">最高分 <b id="bestScore">0</b> · 最高连击 <b id="bestCombo">0</b> · 最佳命中率 <b id="bestRate">--</b></p>
      <p class="tiphint">点击 / 触摸 / 空格 让大肥鱼上浮 · P 暂停 · M 静音</p>
    </div>
  </div>

  <!-- 暂停面板 -->
  <div class="layer" id="uiPause">
    <div class="panel">
      <h2>已暂停</h2>
      <div class="col">
        <button class="btn primary" id="btnResume">继续游戏</button>
        <button class="btn" id="btnRestart">重新开始</button>
        <button class="btn" id="btnMute2">静音：关</button>
        <button class="btn ghost" id="btnMenu">返回主菜单</button>
      </div>
    </div>
  </div>

  <!-- 结算面板 -->
  <div class="layer" id="uiOver">
    <div class="panel">
      <h2 id="overTitle">缓存击穿！</h2>
      <div class="stats">
        <div><span>总分</span><b id="ovScore">0</b></div>
        <div><span>最高连击</span><b id="ovCombo">0</b></div>
        <div><span>缓存命中率</span><b id="ovRate">0%</b></div>
        <div><span>历史最高分</span><b id="ovBest">0</b></div>
      </div>
      <p class="record" id="ovRecord"></p>
      <div class="col">
        <button class="btn primary" id="btnAgain">再来一局</button>
        <button class="btn ghost" id="btnMenu2">返回主菜单</button>
      </div>
    </div>
  </div>

  <button class="icon-btn" id="btnPause" title="暂停">❚❚</button>
  <button class="icon-btn" id="btnMute" title="静音">♪</button>
</div>

<script>
(function () {
'use strict';

/* ==========================================================================
 * 0. CONFIG —— 所有可调参数集中在这里
 *    数值平衡设计意图写在每一项后面的注释里。
 * ========================================================================== */
var CONFIG = {
  /* --- 设计分辨率与主循环 --- */
  W: 960, H: 540,                 // 逻辑分辨率（16:9），CSS 等比缩放适配全部屏幕
  FIXED: 1 / 60,                  // 固定时间步长（秒）
  MAX_FRAME: 0.25,                // 单帧最大补偿时间，防止切后台回来“瞬移”
  INPUT_CD: 0.08,                 // 两次有效点击最小间隔 80ms，防连点导致物理异常

  /* --- 可玩区域 --- */
  FIELD_TOP: 66,                  // 鱼中心可达的最高点（角色精灵自锚点向上延伸约 56px）
  FIELD_BOTTOM: 452,              // 鱼中心可达的最低点（底部装饰带之上）
  ITEM_TOP: 52,                   // 道具中心生成上限
  ITEM_BOTTOM: 430,               // 道具中心生成下限

  /* --- 鱼 --- */
  FISH_X: 192,                    // 屏幕左侧 1/5 宽度处
  FISH_HIT_R: 28,                 // 碰撞圆半径（贴合角色脸部中心，宽于视觉体积更跟手）
  GRAVITY: 1580,                  // 基础重力 px/s²（偏沉，滞空时间短，难以“悬停”）
  GRAVITY_MAX: 1900,              // 重力软上限，避免后期“一坠到底”不可救
  GRAVITY_ADD: 34,                // 每级难度增加的重力
  JUMP_V: 455,                    // 点击冲量（向上）。单次跳跃高度 ≈ v²/2g ≈ 65px
  MAX_FALL: 900,                  // 终端下落速度，避免高速穿模
  TILT_MAX: 0.55,                 // 最大俯仰角（弧度）

  /* --- 世界滚动 --- */
  SPEED_BASE: 280,                // 基础滚动速度 px/s
  SPEED_ADD: 13,                  // 每级难度增加的速度
  SPEED_MAX: 405,                 // 速度软上限：与最小生成间隔配合，保证反应窗口 ≥ 0.5s

  /* --- 生成 --- */
  SPAWN_BASE: 0.85,               // 基础生成间隔（秒）
  SPAWN_DECAY: 0.036,             // 每级缩短的间隔
  SPAWN_MIN: 0.52,                // 最小生成间隔软下限（= 最短反应窗口）
  CORRIDOR_BASE: 58,              // 安全通道半高；鱼中心安全带 ≈ ±(该值 − 9)px
  CORRIDOR_DECAY: 1.0,            // 每级收窄量
  CORRIDOR_MIN: 49,               // 通道软下限：满级仍有约 12px 单边容错，再窄就变“必死局”
  BUG_RATE_BASE: 0.48,
  BUG_RATE_ADD: 0.06,
  BUG_RATE_MAX: 1.05,
  /* 单次生成安全通道的最大位移。上限依据：最短生成间隔 0.52s，
     鱼持续上爬速度上限约 300px/s → 0.52s 最多上升约 156px；
     再留出玩家偏离通道的余量，取 118px，保证任何情况下都飞得过去。 */
  PATH_STEP_BASE: 96,
  PATH_STEP_ADD: 2.4,
  PATH_STEP_MAX: 118,
  GATE_CHANCE_BASE: 0.34,         // “闸门”模板（通道上下各一个 Bug）触发概率
  GATE_CHANCE_ADD: 0.05,          // 每级递增
  TOKEN_R: 16, BUG_R: 17,

  /* --- 计分 / 连击 --- */
  SCORE_HIT: 10,                  // HIT 基础分
  COMBO_STEP: 5,                  // 每 5 连击提升一级倍率
  COMBO_MAX_MULT: 5,              // 倍率上限 5×

  /* --- 缓存热 --- */
  HEAT_BASE: 12,                  // 触发所需连续 HIT 数
  HEAT_ADD: 1.2,                  // 每级难度递增
  HEAT_MAX: 22,                   // 软上限
  HEAT_TIME_MIN: 2.5, HEAT_TIME_MAX: 4.5,  // 持续 2.5~4.5 秒
  HEAT_TAIL: 6,                   // 缓存热结束后额外保留 6 个 HIT 才开始重新计数（防止连续触发）

  /* --- 峰时 / 谷时（严格按规格） --- */
  PEAK_SPEED: 1.0, PEAK_BUG: 2.0, PEAK_TOKEN: 1.3, PEAK_HIT: 0.8,
  VALLEY_SPEED: 1.4, VALLEY_BUG: 0.5, VALLEY_TOKEN: 1.0, VALLEY_HIT: 1.0,
  HIT_CHANCE_BASE: 0.80,          // 命中率基数，峰时 ×0.8 / 谷时 ×1.0
  PHASE_FADE: 1.0,                // 峰谷过渡 1 秒

/* ==========================================================================
 * 1. 工具函数
 * ========================================================================== */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function moveToward(cur, target, step) {
  if (cur < target) return Math.min(target, cur + step);
  if (cur > target) return Math.max(target, cur - step);
  return target;
}
/* 圆角矩形路径（不依赖 ctx.roundRect，兼容旧 Safari/Firefox） */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}
/* 确定性伪随机（背景生成用，保证每次布局一致） */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mixColor(a, b, t) {
  return 'rgb(' + ((a[0] + (b[0] - a[0]) * t) | 0) + ',' +
                  ((a[1] + (b[1] - a[1]) * t) | 0) + ',' +
                  ((a[2] + (b[2] - a[2]) * t) | 0) + ')';
}

var Store = (function () {

              muted: 'fatfish.muted', tut: 'fatfish.tutorialDone' };

  } catch (e) { ok = false; }

      return (v === null || v === undefined) ? d : v;
    } catch (e) { return d; }
  }
  function set(k, v) {
    try { if (ok) window.localStorage.setItem(k, String(v)); else mem[k] = String(v); }
    catch (e) { mem[k] = String(v); }

/* ==========================================================================
 * 3. 音频引擎 —— WebAudio 程序化合成（BGM + 音效）
 *    无音频设备 / 浏览器不支持时静默降级，游戏照常运行。
 * ========================================================================== */
var Audio2 = (function () {
  var ctx = null, master = null, musicBus = null, sfxBus = null, lp = null, comp = null;
  var noiseBuf = null;
  var ready = false, dead = false;
  var muted = Store.muted;
  var bpm = 112, step = 0, nextTime = 0, musicOn = false;
  var LOOKAHEAD = 0.14, STEP16 = 0;
  var CHORDS = [45, 41, 48, 43];        // A2 F2 C3 G2 —— 两小节循环
  var ARP = [0, 7, 12, 16, 12, 7, 4, 7];
  var filterTarget = 4200;

  function init() {
    if (ready || dead) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { dead = true; return; }
    try { ctx = new AC(); } catch (e) { dead = true; return; }
    try {
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9;
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp); comp.connect(ctx.destination);

      lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = filterTarget; lp.Q.value = 0.8;
      lp.connect(master);

      musicBus = ctx.createGain(); musicBus.gain.value = 0.30; musicBus.connect(lp);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);

      // 噪声缓冲（鼓点 / 撞 Bug 用）
      var len = Math.floor(ctx.sampleRate * 0.7);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      ready = true;
    } catch (e) { dead = true; ready = false; }
  }

  function midi(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function tone(time, freq, dur, type, vol, glideTo, bus) {
    if (!ready) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, time);
      if (glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), time + dur);
      g.gain.setValueAtTime(CONFIG.PASSIVE, time);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), time + 0.008);
      g.gain.exponentialRampToValueAtTime(CONFIG.PASSIVE, time + dur);
      o.connect(g); g.connect(bus || sfxBus);
      o.start(time); o.stop(time + dur + 0.03);
    } catch (e) { /* 忽略：音频失败不影响游戏 */ }
  }

  function noise(time, dur, vol, f0, f1, q, bus) {
    if (!ready || !noiseBuf) return;
    try {
      var s = ctx.createBufferSource(); s.buffer = noiseBuf;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q || 1.2;
      bp.frequency.setValueAtTime(f0, time);
      if (f1) bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), time + dur);
      var g = ctx.createGain();
      g.gain.setValueAtTime(Math.max(0.0002, vol), time);
      g.gain.exponentialRampToValueAtTime(CONFIG.PASSIVE, time + dur);
      s.connect(bp); bp.connect(g); g.connect(bus || sfxBus);
      s.start(time); s.stop(time + dur + 0.02);
    } catch (e) {}
  }

  /* ---------------- BGM 步进音序器 ---------------- */
  function kick(t) {
    if (!ready) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(46, t + 0.12);
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(CONFIG.PASSIVE, t + 0.16);
      o.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t + 0.2);
    } catch (e) {}
  }
  function hat(t, v) { noise(t, 0.045, v, 8200, 5200, 0.9, musicBus); }
  function bassNote(t, m, dur) { tone(t, midi(m), dur, 'sawtooth', 0.16, null, musicBus); }
  function leadNote(t, m, dur) { tone(t, midi(m), dur, 'triangle', 0.085, null, musicBus); }

  function scheduleStep(s, t) {
    var chord = CHORDS[((s / 8) | 0) % 4];
    var inC = s % 8;
    if (inC === 0 || inC === 3) kick(t);
    if (inC === 6) kick(t);
    if (s % 2 === 1) hat(t, 0.06);
    if (s % 4 === 2) hat(t, 0.035);
    if (inC === 0 || inC === 3 || inC === 5) bassNote(t, chord - 12, 0.20);
    leadNote(t, chord + 12 + ARP[inC], 0.16);
    if (s % 16 === 14) leadNote(t + 0.06, chord + 24, 0.12);
  }

  function tick() {
    if (!ready || muted || !musicOn) return;
    if (ctx.state === 'suspended') return;
    var now = ctx.currentTime;
    if (nextTime < now) nextTime = now + 0.06;
    var guard = 0;
    while (nextTime < now + LOOKAHEAD && guard++ < 32) {
      scheduleStep(step, nextTime);
      nextTime += (60 / bpm) / 4;
      step = (step + 1) % 32;
    }
  }

  /* ---------------- 对外接口 ---------------- */
  var api = {
    unlock: function () {
      init();
      if (!ready) return;
      try { if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
      if (!musicOn) { musicOn = true; nextTime = ctx.currentTime + 0.08; step = 0; }
    },
    tick: tick,
    isMuted: function () { return muted; },
    setMuted: function (m) {
      muted = !!m;
      if (ready) {
        try { master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.04); } catch (e) {}
      }
    },
    /* 峰谷影响音乐：峰时更快更亮，谷时稍慢更闷 */
    setPhase: function (peak) {
      bpm = peak ? 122 : 110;
      filterTarget = peak ? 3000 : 5200;
      if (ready) {
        try { lp.frequency.setTargetAtTime(filterTarget, ctx.currentTime, 0.25); } catch (e) {}
      }
    },
    setIntensity: function (playing) {
      if (!ready) return;
      try { musicBus.gain.setTargetAtTime(playing ? 0.26 : 0.17, ctx.currentTime, 0.3); } catch (e) {}
    },
    /* ---- 音效 ---- */
    sfxHit: function (combo) {
      if (!ready) return;
      var t = ctx.currentTime;
      var f = 640 * Math.pow(1.055, Math.min(16, combo));
      tone(t, f, 0.075, 'triangle', 0.30, f * 1.6);
      tone(t + 0.028, f * 2, 0.09, 'sine', 0.16);
    },
    sfxMiss: function () {
      if (!ready) return;
      var t = ctx.currentTime;
      tone(t, 230, 0.13, 'square', 0.16, 110);
      noise(t, 0.08, 0.06, 900, 300, 0.8);
    },
    sfxCrash: function () {
      if (!ready) return;
      var t = ctx.currentTime;
      noise(t, 0.5, 0.42, 1600, 120, 0.6);
      tone(t, 180, 0.55, 'sawtooth', 0.28, 42);
      tone(t + 0.02, 90, 0.6, 'sine', 0.3, 34);
    },
    sfxHeatOn: function () {
      if (!ready) return;
      var t = ctx.currentTime, s = [0, 4, 7, 12, 16];
      for (var i = 0; i < s.length; i++) tone(t + i * 0.055, midi(72 + s[i]), 0.20, 'triangle', 0.22);
      noise(t, 0.35, 0.10, 3000, 7000, 0.7);
    },
    sfxHeatOff: function () {
      if (!ready) return;
      var t = ctx.currentTime, s = [16, 12, 7, 4, 0];
      for (var i = 0; i < s.length; i++) tone(t + i * 0.06, midi(76 + s[i]), 0.18, 'sine', 0.16);
    },
    sfxPhase: function (peak) {
      if (!ready) return;
      var t = ctx.currentTime;
      if (peak) { tone(t, midi(69), 0.16, 'square', 0.14); tone(t + 0.09, midi(76), 0.22, 'square', 0.13); }
      else { tone(t, midi(76), 0.16, 'square', 0.13); tone(t + 0.09, midi(69), 0.22, 'square', 0.14); }
    },
    sfxUI: function () { if (!ready) return; tone(ctx.currentTime, 1180, 0.045, 'square', 0.10, 900); },
    sfxLevel: function () {
      if (!ready) return;
      var t = ctx.currentTime;
      tone(t, midi(60), 0.14, 'sawtooth', 0.12); tone(t + 0.07, midi(67), 0.20, 'sawtooth', 0.12);
    },
    sfxFlap: function () { if (!ready) return; noise(ctx.currentTime, 0.07, 0.055, 700, 1600, 1.1); }
  };
  return api;
})();

/* ==========================================================================
 * 4. 对象池 —— 循环中绝不 new，容量耗尽直接返回 null（不生成）
 * ========================================================================== */
function Pool(size, factory) {
  this.items = [];
  this.free = [];
  this.size = size;
  for (var i = 0; i < size; i++) {
    var o = factory();
    o.active = false;
    this.items.push(o);
    this.free.push(o);
  }
}
Pool.prototype.obtain = function () {
  if (this.free.length === 0) return null;
  var o = this.free.pop();
  o.active = true;
  return o;
};
Pool.prototype.release = function (o) {
  if (!o.active) return;
  o.active = false;
  if (this.free.length < this.size) this.free.push(o);
};
Pool.prototype.each = function (fn) {
  var a = this.items;
  for (var i = 0; i < a.length; i++) if (a[i].active) fn(a[i], i);
};
Pool.prototype.count = function () { return this.size - this.free.length; };
Pool.prototype.clear = function () {
  this.free.length = 0;
  for (var i = 0; i < this.items.length; i++) {
    this.items[i].active = false;
    this.free.push(this.items[i]);
  }
};

/* ==========================================================================
 * 6. 画布适配 —— devicePixelRatio 高清 + 竖屏自动旋转逻辑
 * ========================================================================== */
var view = { w: CONFIG.W, h: CONFIG.H, scale: 1, dprScale: 1, portrait: false };

function layout() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var portrait = vh > vw * 1.02;
  var sw, rot = 0;
  if (!portrait) {
    // 桌面 / 横屏：等比缩放居中，两侧自然留黑边
    sw = Math.min(vw, vh * CONFIG.W / CONFIG.H);
    rot = 0;
  } else {
    // 手机竖屏：把逻辑画面旋转 90°，让玩家横过手机获得全屏体验
    sw = Math.min(vh, vw * CONFIG.W / CONFIG.H);
    rot = 90;
  }
  var sh = sw * CONFIG.H / CONFIG.W;
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  stage.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
  stage.style.setProperty('--u', (sw / CONFIG.W) + 'px');

  // 背板分辨率：跟随 CSS 缩放倍率，兼顾清晰度与低端机性能
  var eff = clamp((window.devicePixelRatio || 1) * (sw / CONFIG.W), 1, 2.0);
  cv.width = Math.round(CONFIG.W * eff);
  cv.height = Math.round(CONFIG.H * eff);
  view.scale = sw / CONFIG.W;
  view.dprScale = eff;
  view.portrait = portrait;
  view.w = sw; view.h = sh;
  ctx.imageSmoothingEnabled = true;
}
layout();
window.addEventListener('resize', layout, { passive: true });
window.addEventListener('orientationchange', function () { setTimeout(layout, 120); }, { passive: true });

function phaseMax(t) { t = (t === undefined) ? play.elapsed : t; return Math.max(CONFIG.PHASE_MAX_FLOOR, CONFIG.PHASE_MAX_BASE - t * CONFIG.PHASE_MAX_DECAY); }

/* ==========================================================================

var PAL = {
  hit: ['#7ff0c8', '#4de1ff', '#8fb6ff', '#ffffff'],
  miss: ['#8a95a8', '#6d7787', '#aab4c4'],
  bug: ['#ff5b6e', '#ff2f5e', '#ff9a4d', '#ffd0d8'],
  gold: ['#ffd76a', '#ffe9a8', '#ffb43d', '#fff6d8'],
  peak: ['#ff6ba8', '#c34bff', '#ff9a6b'],
  valley: ['#4de1ff', '#5affd0', '#7ea8ff']

function qualityFactor() { return quality === 2 ? 1 : (quality === 1 ? 0.6 : 0.32); }

function burst(x, y, n, opt) {
  opt = opt || {};

  for (var i = 0; i < n; i++) {
    var p = particlePool.obtain();
    if (!p) return;
    var a = opt.dir !== undefined ? opt.dir + rnd(-0.7, 0.7) : rnd(0, Math.PI * 2);
    var sp = rnd(opt.spMin || 60, opt.spMax || 240);
    p.kind = opt.kind === undefined ? 0 : opt.kind;
    p.x = p.px = x; p.y = p.py = y;
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    p.maxLife = p.life = rnd(opt.lifeMin || 0.35, opt.lifeMax || 0.8);
    p.size = rnd(opt.sizeMin || 2, opt.sizeMax || 5.5);
    p.g = opt.g === undefined ? 260 : opt.g;
    p.drag = opt.drag === undefined ? 0.86 : opt.drag;
    p.col = pal[(Math.random() * pal.length) | 0];

function ringBurst(x, y, n, pal, life) {
  n = Math.max(1, Math.round(n * qualityFactor()));
  for (var i = 0; i < n; i++) {
    var p = particlePool.obtain();
    if (!p) return;
    var a = (i / n) * Math.PI * 2;
    p.kind = 0;
    p.x = p.px = x + Math.cos(a) * 6; p.y = p.py = y + Math.sin(a) * 6;
    p.vx = Math.cos(a) * 200; p.vy = Math.sin(a) * 200;
    p.maxLife = p.life = life || 0.9;
    p.size = rnd(3, 6); p.g = 0; p.drag = 0.9;
    p.col = PAL[pal][(Math.random() * PAL[pal].length) | 0];
    p.rot = 0; p.spinV = 0; p.ring = 0; p.text = '';
  }
}
function floatText(x, y, txt, col, size) {
  var p = particlePool.obtain();
  if (!p) return;
  p.kind = 2;
  p.x = p.px = x; p.y = p.py = y;
  p.vx = 26; p.vy = -76;
  p.maxLife = p.life = 0.95;
  p.size = size || 20; p.g = 40; p.drag = 0.94;
  p.col = col; p.text = txt; p.rot = 0; p.spinV = 0; p.ring = 0;
}
function updateParticles(dt) {
  particlePool.each(function (p) {
    p.px = p.x; p.py = p.y;
    p.life -= dt;
    if (p.life <= 0) { particlePool.release(p); return; }
    p.vy += p.g * dt;
    var d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.spinV * dt;
  });
}

 * 9. 背景（多层视差 + 峰谷色调过渡）
 * ========================================================================== */
var BG = { m1: [], m2: [], clouds: [], lines: [], rocks: [], bubbles: [], sky: null, skyKey: -1 };
(function buildBG() {
  var R = mulberry32(20240607);
  var i;
  for (i = 0; i < 48; i++) BG.m1.push(0.32 + R() * 0.68);
  for (i = 0; i < 40; i++) BG.m2.push(0.40 + R() * 0.60);
  for (i = 0; i < 22; i++) BG.clouds.push({ x: R() * 1400, y: 34 + R() * 190, s: 0.55 + R() * 1.1, v: 5 + R() * 11, a: 0.12 + R() * 0.20 });
  for (i = 0; i < 48; i++) BG.lines.push({ x: R() * 1400, h: 30 + R() * 190, a: 0.05 + R() * 0.13, w: 1 + R() * 2 });
  for (i = 0; i < 30; i++) BG.rocks.push({ x: R() * 1400, w: 26 + R() * 74, h: 8 + R() * 26 });
  for (i = 0; i < 26; i++) BG.bubbles.push({ x: R() * 1400, y: 200 + R() * 300, r: 2 + R() * 5, v: 12 + R() * 26 });
})();

var SKY = {
  valley: [[10, 44, 74], [30, 110, 152], [64, 186, 190]],
  peak: [[58, 16, 74], [122, 30, 112], [206, 72, 122]]
};
var HILL = { valley: [22, 80, 124], peak: [124, 40, 118] };
var HILL2 = { valley: [12, 52, 92], peak: [86, 26, 92] };
var SEAB = { valley: [7, 34, 58], peak: [46, 14, 54] };

function drawMountains(list, period, baseY, maxH, color, scrollPx) {
  var off = ((scrollPx % period) + period) % period;
  var n = Math.ceil(CONFIG.W / period) + 2;
  var startIdx = Math.floor(scrollPx / period);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-off - period, baseY);
  for (var i = -1; i < n; i++) {
    var h = maxH * list[((startIdx + i) % list.length + list.length) % list.length];
    var x = i * period - off;
    // 二次曲线 → 圆润的卡通山丘（控制点取谷底高度的 2 倍，使顶点高度约为 h）
    ctx.quadraticCurveTo(x + period * 0.5, baseY - h * 2, x + period, baseY);
  }
  ctx.lineTo(CONFIG.W + period, CONFIG.H + 10);
  ctx.lineTo(-off - period * 2, CONFIG.H + 10);
  ctx.closePath();
  ctx.fill();
}

function drawBackground(alpha, dt) {
  var mix = phase.mix;
  var sc = play.scroll;

  // 天空（渐变按色调缓存，避免每帧创建）
  var mixKey = Math.round(mix * 120);
  if (BG.skyKey !== mixKey || !BG.sky) {
    BG.skyKey = mixKey;
    var g = ctx.createLinearGradient(0, 0, 0, CONFIG.H);
    g.addColorStop(0, mixColor(SKY.valley[0], SKY.peak[0], mix));
    g.addColorStop(0.55, mixColor(SKY.valley[1], SKY.peak[1], mix));
    g.addColorStop(1, mixColor(SKY.valley[2], SKY.peak[2], mix));
    BG.sky = g;
  }
  ctx.fillStyle = BG.sky;
  ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);

  // 数据流线条（视差 0.55）
  if (quality >= 1) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    var lo = sc * 0.55;
    ctx.strokeStyle = mix > 0.5 ? 'rgba(255,140,200,0.5)' : 'rgba(120,240,255,0.5)';
    ctx.lineWidth = 1.4;
    for (var i = 0; i < BG.lines.length; i++) {
      var L = BG.lines[i];
      var lx = ((L.x - lo) % 1400 + 1400) % 1400 - 200;
      if (lx < -60 || lx > CONFIG.W + 60) continue;
      ctx.globalAlpha = L.a;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, L.h);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 云
  if (quality >= 1) {
    ctx.save();
    var co = sc * 0.22 + TIME * 3;
    for (var cI = 0; cI < BG.clouds.length; cI++) {
      var C = BG.clouds[cI];
      var cx = ((C.x - co) % 1400 + 1400) % 1400 - 240;
      if (cx < -220 || cx > CONFIG.W + 220) continue;
      ctx.globalAlpha = C.a;
      ctx.fillStyle = mix > 0.5 ? '#ffd8ee' : '#d8f6ff';
      ctx.beginPath();
      ctx.arc(cx, C.y, 26 * C.s, 0, 6.2832);
      ctx.arc(cx + 30 * C.s, C.y + 6 * C.s, 20 * C.s, 0, 6.2832);
      ctx.arc(cx - 30 * C.s, C.y + 8 * C.s, 17 * C.s, 0, 6.2832);
      ctx.arc(cx + 8 * C.s, C.y - 14 * C.s, 19 * C.s, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  // 远山（视差 0.16 / 0.34）
  drawMountains(BG.m1, 210, 452, 268, mixColor(HILL.valley, HILL.peak, mix), sc * 0.16);
  drawMountains(BG.m2, 165, 470, 218, mixColor(HILL2.valley, HILL2.peak, mix), sc * 0.34);

  // 海底装饰带（与场景 1:1 滚动）
  var seaCol = mixColor(SEAB.valley, SEAB.peak, mix);
  ctx.fillStyle = seaCol;
  ctx.beginPath();
  ctx.moveTo(0, CONFIG.H);
  ctx.lineTo(0, 494);
  var step = 60;
  var off2 = ((sc % step) + step) % step;
  for (var x2 = -step; x2 <= CONFIG.W + step; x2 += step) {
    var px = x2 - off2;
    ctx.quadraticCurveTo(px + step * 0.5, 494 + ((x2 / step) % 2 === 0 ? -9 : 7), px + step, 494);
  }
  ctx.lineTo(CONFIG.W + step, CONFIG.H);
  ctx.closePath();
  ctx.fill();

  // 石头
  ctx.save();
  ctx.fillStyle = mix > 0.5 ? 'rgba(120,40,90,0.55)' : 'rgba(16,58,84,0.65)';
  for (var rI = 0; rI < BG.rocks.length; rI++) {
    var K = BG.rocks[rI];
    var rx = ((K.x - sc) % 1400 + 1400) % 1400 - 200;
    if (rx < -120 || rx > CONFIG.W + 120) continue;
    ctx.beginPath();
    ctx.moveTo(rx, 502);
    ctx.quadraticCurveTo(rx + K.w * 0.35, 502 - K.h, rx + K.w * 0.72, 502 - K.h * 0.4);
    ctx.quadraticCurveTo(rx + K.w, 502 - K.h * 0.15, rx + K.w + 6, 502);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 气泡（视差 0.8，向上飘）
  if (quality >= 1) {
    ctx.save();
    ctx.fillStyle = mix > 0.5 ? 'rgba(255,190,230,0.30)' : 'rgba(180,245,255,0.28)';
    var bo = sc * 0.8 - TIME * 14;
    for (var bI = 0; bI < BG.bubbles.length; bI++) {
      var B = BG.bubbles[bI];
      var bx = ((B.x - bo) % 1400 + 1400) % 1400 - 200;
      if (bx < -40 || bx > CONFIG.W + 40) continue;
      var by = 540 - (((TIME * B.v + B.y) % 480));
      ctx.beginPath();
      ctx.arc(bx, by, B.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
  }

  // 峰谷整体色调覆盖
  if (mix > 0.01) {
    ctx.save();
    ctx.globalAlpha = 0.10 * mix;
    ctx.fillStyle = '#ff3b7a';
    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
    ctx.restore();
  }
}

  lean: 0.02             // 恒定前倾角（弧度）：原画已是水平飞行姿态，只需极轻微前倾
};
(function loadHeroSprite() {
  try {
    var im = new Image();
    im.onload = function () { HERO.ready = true; };
    im.onerror = function () { HERO.failed = true; };
    im.src = HERO_SPRITE_SRC;      // 见本文件内嵌的 data URI
    HERO.img = im;
  } catch (e) { HERO.failed = true; }
})();

function drawFish(cx, cy, rot, sc, mood) {
  if (!HERO.ready) { drawFishProcedural(cx, cy, rot, sc, mood); return; }
  var f = ctx;
  var dead = mood === 'dead';
  f.save();
  f.translate(cx, cy);
  // 恒定前倾 + 速度俯仰：整体始终朝向前进方向（横版跑酷的侧面感）
  f.rotate(dead ? rot : clamp(rot + HERO.lean, -0.45, 0.62));
  // 呼吸感的极轻微缩放（不做像素级形变，保持原画质感）
  var breathe = dead ? 1 : (1 + Math.sin(TIME * 3.1) * 0.012);
  var h = HERO.drawH * sc * breathe;
  var w = h * (HERO.w / HERO.h);
  var ox = -HERO.ax * w, oy = -HERO.ay * h;

  // 缓存热金色光环（画在角色后面）
  if (fish.aura > 0.02) {
    f.save();
    f.globalAlpha = fish.aura * 0.8;
    var ag = f.createRadialGradient(0, 0, 6, 0, 0, h * 0.78);
    ag.addColorStop(0, 'rgba(255,228,150,0.85)');
    ag.addColorStop(0.55, 'rgba(255,190,60,0.30)');
    ag.addColorStop(1, 'rgba(255,180,60,0)');
    f.fillStyle = ag;
    f.beginPath(); f.arc(0, 0, h * 0.78, 0, 6.2832); f.fill();
    f.restore();
  }
  f.drawImage(HERO.img, ox, oy, w, h);
  f.restore();
}

var FG = null;

function drawWhaleMark(x, y, s) {

/* mood: 'idle' | 'play' | 'dead'；sc: 缩放 */
function drawFishProcedural(cx, cy, rot, sc, mood) {
  var f = ctx;
  if (!FG) buildFishGradients();
  f.save();
  f.translate(cx, cy);
  f.rotate(rot);
  if (sc !== 1) f.scale(sc, sc);

  var dead = mood === 'dead';
  var wag = Math.sin(TIME * (dead ? 4 : 7.6)) * (dead ? 0.18 : 0.30);
  var finWave = Math.sin(TIME * 9.5) * 0.28;
  var flow = Math.sin(TIME * 2.6);

  /* ================= 1. 鲸鱼尾鳍（身后） ================= */
  f.save();
  f.translate(-36, 6);
  f.rotate(wag * 0.5);
  f.fillStyle = FG.tail;
  f.beginPath();
  f.moveTo(6, 0);
  f.bezierCurveTo(0, -10, -14, -26, -4, -34);
  f.bezierCurveTo(2, -28, 9, -14, 13, -5);
  f.lineTo(13, 5);
  f.bezierCurveTo(9, 14, 2, 28, -4, 34);
  f.bezierCurveTo(-14, 26, 0, 10, 6, 0);
  f.closePath();

  f.strokeStyle = 'rgba(255,255,255,0.55)'; f.lineWidth = 1.6; f.stroke();

  /* ================= 2. 后方长发（大块 + 波动发梢） ================= */
  f.fillStyle = FG.hair;

  f.moveTo(16, -24);
  f.bezierCurveTo(-12, -32, -40, -16, -38, 8);

  f.bezierCurveTo(-22, 26, -20, 12, -8, 4);
  f.bezierCurveTo(2, -2, 10, -10, 16, -24);
  f.closePath();
  f.fill();
  // 流动发梢（三条，随时间摆动）
  for (var i = 0; i < 3; i++) {
    var ph = TIME * 3.2 + i * 1.15;
    f.beginPath();
    f.moveTo(-2 - i * 4, -16 + i * 8);
    f.quadraticCurveTo(-24 - i * 6, -10 + i * 10 + Math.sin(ph) * 4,
                       -34 - i * 7, 8 + i * 12 + Math.sin(ph + 0.8) * 6);
    f.quadraticCurveTo(-22 - i * 5, 10 + i * 10, -6 - i * 4, -4 + i * 8);

  }
  // 头发高光

  /* ================= 3. 远侧鲸鳍耳饰（白色薄片） ================= */
  f.save();
  f.translate(-11, -7);
  f.rotate(-0.30 + finWave * 0.30);
  f.fillStyle = FG.frill;
  f.beginPath();
  f.moveTo(4, 0);
  f.quadraticCurveTo(-14, -16, -27, -5);
  f.quadraticCurveTo(-20, 6, -9, 10);
  f.quadraticCurveTo(-2, 7, 4, 0);
  f.closePath();
  f.fill();
  f.strokeStyle = 'rgba(150,185,255,0.85)'; f.lineWidth = 1.2; f.stroke();
  // 鳍分叉纹
  f.beginPath(); f.moveTo(-6, 2); f.quadraticCurveTo(-15, -2, -22, -4); f.stroke();
  f.restore();

  /* ================= 4. 女仆装身体 ================= */
  // 深蓝连衣裙
  f.fillStyle = FG.dress;
  f.beginPath();
  f.moveTo(-26, -2);
  f.quadraticCurveTo(-32, 20, -18, 32);
  f.quadraticCurveTo(0, 38, 14, 28);
  f.quadraticCurveTo(20, 16, 14, 2);
  f.quadraticCurveTo(-6, 14, -26, -2);
  f.closePath();
  f.fill();
  // 白色围裙 + 荷叶边
  f.fillStyle = FG.apron;
  f.beginPath();
  f.moveTo(-20, 6);
  f.quadraticCurveTo(-16, 32, 4, 32);
  f.quadraticCurveTo(16, 24, 13, 6);
  f.quadraticCurveTo(-4, 16, -20, 6);
  f.closePath();
  f.fill();
  f.save();
  f.strokeStyle = 'rgba(150,185,255,0.9)'; f.lineWidth = 1.3; f.lineCap = 'round';
  for (var k = 0; k < 5; k++) {
    var t = k / 5;
    var ax = -20 + t * 24, ay = 6 + t * 26;
    f.beginPath(); f.arc(ax + 2, ay + 1, 3.4, 0.2, Math.PI - 0.2); f.stroke();
  }
  f.restore();
  drawWhaleMark(-8, 18, 0.85);
  // 肩线（深蓝泡泡袖）
  f.fillStyle = FG.dress;
  f.beginPath(); f.ellipse(-18, 2, 9, 7, -0.3, 0, 6.2832); f.fill();
  f.beginPath(); f.ellipse(10, 0, 8, 6.5, 0.35, 0, 6.2832); f.fill();

  /* ================= 5. 白色水手领 + 蓝领结 ================= */
  f.fillStyle = '#FFFFFF';
  f.beginPath();
  f.moveTo(-16, -6);
  f.quadraticCurveTo(-4, 10, 10, 4);
  f.quadraticCurveTo(2, -8, -16, -6);
  f.closePath();
  f.fill();
  f.strokeStyle = 'rgba(150,185,255,0.9)'; f.lineWidth = 1.1; f.stroke();
  f.fillStyle = '#3B62E0';
  f.beginPath(); f.ellipse(-3, 0, 4.6, 2.8, -0.35, 0, 6.2832); f.fill();
  f.beginPath(); f.ellipse(-3, 0, 1.8, 1.7, 0, 0, 6.2832);
  f.fillStyle = '#8FB4FF'; f.fill();

  /* ================= 6. 手（小圆手，随节奏摆） ================= */
  f.save();
  f.translate(8, 16);
  f.rotate(0.3 + finWave * 0.5);
  f.fillStyle = FG.skin;
  f.beginPath(); f.ellipse(0, 0, 6, 5.4, 0, 0, 6.2832); f.fill();
  f.restore();

  /* ================= 7. 头部 ================= */
  var HX = 17, HY = -6;
  f.fillStyle = FG.skin;
  f.beginPath();
  f.ellipse(HX + 1, HY, 23, 22, 0, 0, 6.2832);
  f.fill();

  /* ---- 刘海（覆盖额头，右侧留出脸） ---- */
  f.fillStyle = FG.hair;
  f.beginPath();

  f.bezierCurveTo(-13, -32, 12, -45, 34, -30);
  f.bezierCurveTo(41, -22, 40, -11, 35, -14);
  // 波浪形刘海下缘
  f.bezierCurveTo(33, -23, 26, -21, 22, -15);
  f.bezierCurveTo(18, -9, 12, -13, 8, -17);
  f.bezierCurveTo(3, -12, -3, -7, -11, -2);
  f.closePath();
  f.fill();
  // 左侧鬓发（沿脸颊垂下）
  f.beginPath();
  f.moveTo(-1, -22);
  f.quadraticCurveTo(-12, -4, -13, 18);
  f.quadraticCurveTo(-3, 13, 2, -2);
  f.quadraticCurveTo(4, -13, -1, -22);
  f.closePath();
  f.fill();

  /* ---- 白色荷叶边女仆头饰 ---- */
  f.save();
  f.strokeStyle = '#FFFFFF'; f.lineWidth = 5.5; f.lineCap = 'round';
  f.beginPath(); f.arc(HX + 1, HY, 24, Math.PI * 1.08, Math.PI * 1.92); f.stroke();
  f.strokeStyle = 'rgba(160,195,255,0.5)'; f.lineWidth = 1.3;
  f.beginPath(); f.arc(HX + 1, HY, 21.4, Math.PI * 1.08, Math.PI * 1.92); f.stroke();
  f.fillStyle = '#FFFFFF';
  for (var s = 0; s <= 9; s++) {
    var ang = Math.PI * 1.08 + (Math.PI * 0.84) * (s / 9);
    f.beginPath();
    f.arc(HX + 1 + Math.cos(ang) * 27.5, HY + Math.sin(ang) * 27.5, 4.2, 0, 6.2832);
    f.fill();
  }
  f.restore();

  /* ---- 头顶大卷呆毛 ---- */
  f.save();
  f.strokeStyle = '#6E96FF'; f.lineWidth = 3.8; f.lineCap = 'round'; f.lineJoin = 'round';
  f.beginPath();
  f.moveTo(17, -32);
  f.bezierCurveTo(12, -45, 21, -52, 28, -47 + flow * 1.2);
  f.bezierCurveTo(34, -43, 29, -35, 24, -40 + flow * 0.8);
  f.stroke();
  f.restore();

  /* ---- 近侧鲸鳍耳饰（脸侧，朝前） ---- */
  f.save();
  f.translate(36, 5);
  f.rotate(0.22 + finWave * 0.26);
  f.fillStyle = FG.frill;
  f.beginPath();
  f.moveTo(0, -8);
  f.quadraticCurveTo(14, -13, 18, -1);
  f.quadraticCurveTo(13, 8, 1, 9);
  f.quadraticCurveTo(-1, 1, 0, -8);
  f.closePath();
  f.fill();
  f.strokeStyle = 'rgba(150,185,255,0.85)'; f.lineWidth = 1.2; f.stroke();
  f.beginPath(); f.moveTo(4, 0); f.quadraticCurveTo(11, -3, 15, -5); f.stroke();
  f.restore();

  /* ================= 8. 脸 ================= */
  var blink = fish.blink;
  function eye(ex, ey, r) {

    f.beginPath(); f.ellipse(ex, ey, r * 0.98, r * 1.12, 0, 0, 6.2832); f.fill();
    if (blink > 0.5) {
      f.fillStyle = '#FFFFFF';
      f.beginPath(); f.ellipse(ex, ey + r * 0.28, r * 0.80, r * 0.42, 0, 0, 6.2832); f.fill();
      f.strokeStyle = '#2A3A78'; f.lineWidth = r * 0.36; f.lineCap = 'round';
      f.beginPath(); f.arc(ex, ey + r * 0.10, r * 0.72, 0.30, Math.PI - 0.30); f.stroke();
      return;
    }
    // 眼白
    f.fillStyle = '#FFFFFF';
    f.beginPath(); f.ellipse(ex, ey, r * 0.84, r * 1.02, 0, 0, 6.2832); f.fill();
    // 虹膜（上浅下深）
    f.fillStyle = '#4E86FF';
    f.beginPath(); f.ellipse(ex + r * 0.06, ey - r * 0.08, r * 0.72, r * 0.86, 0, 0, 6.2832); f.fill();
    f.fillStyle = '#1B47B8';
    f.beginPath(); f.ellipse(ex + r * 0.08, ey + r * 0.30, r * 0.66, r * 0.56, 0, 0, 6.2832); f.fill();
    // 瞳孔
    f.fillStyle = '#0E1B4A';
    f.beginPath(); f.ellipse(ex + r * 0.10, ey + r * 0.08, r * 0.34, r * 0.48, 0, 0, 6.2832); f.fill();
    // 双高光
    f.fillStyle = 'rgba(255,255,255,0.96)';
    f.beginPath(); f.arc(ex - r * 0.28, ey - r * 0.44, r * 0.28, 0, 6.2832); f.fill();
    f.beginPath(); f.arc(ex + r * 0.36, ey + r * 0.42, r * 0.14, 0, 6.2832); f.fill();
    // 睫毛（外眼角加粗）
    f.strokeStyle = '#25316B'; f.lineWidth = r * 0.30; f.lineCap = 'round';
    f.beginPath(); f.arc(ex, ey, r * 0.92, Math.PI * 1.02, Math.PI * 1.98); f.stroke();
  }
  eye(29, -3, 8.0);    // 近眼
  eye(12.5, -5, 6.6);  // 远眼

  /* ---- 腮红 ---- */
  f.fillStyle = 'rgba(255,140,150,0.40)';
  f.beginPath(); f.ellipse(33, 6, 5.6, 3.6, 0, 0, 6.2832); f.fill();
  f.beginPath(); f.ellipse(7, 6, 4.6, 3.2, 0, 0, 6.2832); f.fill();

  /* ---- 小嘴（吃到 Token / 拍翅时张开） ---- */
  var mo = fish.mouth;
  f.fillStyle = '#C4566A';
  f.beginPath();
  f.ellipse(32, 11, 3.2 + mo * 0.9, 2.4 + mo * 2.4, 0, 0, 6.2832);
  f.fill();
  f.fillStyle = '#FFA0AE';
  f.beginPath();
  f.ellipse(32, 11.8 + mo * 1.3, 1.8, 1.1 + mo * 1.0, 0, 0, 6.2832);
  f.fill();

  /* ---- 缓存热金色光环 ---- */
  if (fish.aura > 0.02) {

    f.globalAlpha = fish.aura * 0.75;

    ag.addColorStop(0.6, 'rgba(255,190,60,0.25)');
    ag.addColorStop(1, 'rgba(255,180,60,0)');
    f.fillStyle = ag;
    f.beginPath(); f.arc(2, 0, 62, 0, 6.2832); f.fill();
    f.restore();
  }

  f.restore();
}

 * 11. Token / Bug 绘制
 * ========================================================================== */
/* 离屏精灵：一次性绘制，运行期只做 drawImage，避免每帧创建渐变/路径 */
var SPR = { size: 124, hit: null, miss: null, hot: null, bug: null };
function makeSprite(paint) {
  var c = document.createElement('canvas');
  c.width = c.height = SPR.size;
  var g = c.getContext('2d');
  g.translate(SPR.size / 2, SPR.size / 2);
  paint(g);
  return c;
}
function buildSprites() {
  SPR.hit = makeSprite(function (g) { paintTokenSprite(g, CONFIG.TOKEN_R, false, false); });
  SPR.miss = makeSprite(function (g) { paintTokenSprite(g, CONFIG.TOKEN_R, true, false); });
  SPR.hot = makeSprite(function (g) { paintTokenSprite(g, CONFIG.TOKEN_R, false, true); });
  SPR.bug = makeSprite(function (g) { paintBugSprite(g, CONFIG.BUG_R); });
}

/* 菜单 / 教程演示用对象（预分配，避免每帧创建对象） */
var DEMO = {
  hit: { active: false, x: 700, y: 150, px: 700, py: 150, r: CONFIG.TOKEN_R, hit: true, seed: 1, spin: 0, pop: 0, hot: false },
  miss: { active: false, x: 640, y: 300, px: 640, py: 300, r: CONFIG.TOKEN_R, hit: false, seed: 2, spin: 0, pop: 0, hot: false },
  bug: { active: false, x: 760, y: 440, px: 760, py: 440, r: CONFIG.BUG_R, seed: 3, pulse: 0 },
  orbit: [
    { active: false, x: 0, y: 0, px: 0, py: 0, r: 12, hit: true, seed: 0, spin: 0, pop: 0, hot: false },
    { active: false, x: 0, y: 0, px: 0, py: 0, r: 12, hit: true, seed: 2, spin: 0, pop: 0, hot: false },
    { active: false, x: 0, y: 0, px: 0, py: 0, r: 12, hit: false, seed: 4, spin: 0, pop: 0, hot: false }
  ]
};

function paintTokenSprite(g, R, isMiss, isHot) {
  var ctx = g;                       // 局部遮蔽：以下绘制全部落在离屏画布
  var t = { hit: !isMiss, spin: 0 };
  var hot = isHot;
  var r = R;
  ctx.save();
  ctx.translate(0, 0);

  // 外发光
  var glowR = r * (hot ? 2.5 : 1.9);
  var gg = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, glowR);
  if (hot) { gg.addColorStop(0, 'rgba(255,215,110,0.85)'); gg.addColorStop(1, 'rgba(255,190,60,0)'); }
  else if (t.hit) { gg.addColorStop(0, 'rgba(90,240,200,0.60)'); gg.addColorStop(1, 'rgba(60,200,255,0)'); }
  else { gg.addColorStop(0, 'rgba(130,140,160,0.34)'); gg.addColorStop(1, 'rgba(90,100,120,0)'); }
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(0, 0, glowR, 0, 6.2832); ctx.fill();

  // 球体
  var bg = ctx.createRadialGradient(-r * 0.32, -r * 0.36, r * 0.15, 0, 0, r);
  if (hot) { bg.addColorStop(0, '#fff6c9'); bg.addColorStop(0.5, '#ffcf52'); bg.addColorStop(1, '#d68d10'); }
  else if (t.hit) { bg.addColorStop(0, '#d8fff0'); bg.addColorStop(0.5, '#37e0b0'); bg.addColorStop(1, '#0f7f9c'); }
  else { bg.addColorStop(0, '#c9d2e0'); bg.addColorStop(0.5, '#8b95a6'); bg.addColorStop(1, '#4d5566'); }
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-r * 0.34, -r * 0.40, r * 0.30, r * 0.20, -0.7, 0, 6.2832); ctx.fill();

  // 内圈
  ctx.strokeStyle = hot ? 'rgba(120,70,0,0.55)' : (t.hit ? 'rgba(6,70,60,0.5)' : 'rgba(40,46,58,0.5)');
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, 6.2832); ctx.stroke();

  // 图标
  ctx.strokeStyle = hot ? '#7a4a00' : (t.hit ? '#06463c' : '#2b303a');
  ctx.lineWidth = Math.max(2, r * 0.19);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (t.hit) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.40, r * 0.02);
    ctx.lineTo(-r * 0.10, r * 0.34);
    ctx.lineTo(r * 0.44, -r * 0.34);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-r * 0.34, -r * 0.34); ctx.lineTo(r * 0.34, r * 0.34);
    ctx.moveTo(r * 0.34, -r * 0.34); ctx.lineTo(-r * 0.34, r * 0.34);
    ctx.stroke();
  }
  // 数据环
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = hot ? '#fff3c0' : (t.hit ? '#c7fff0' : '#c3cad8');
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.22, t.spin, t.spin + 2.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.22, t.spin + Math.PI, t.spin + Math.PI + 1.3);
  ctx.stroke();
  ctx.restore();
}

function drawToken(t, alpha) {
  var x = lerp(t.px, t.x, alpha), y = lerp(t.py, t.y, alpha);
  var hot = heat.active && t.hit;
  var spr = hot ? SPR.hot : (t.hit ? SPR.hit : SPR.miss);
  var sc = 1 + Math.sin(TIME * 4.4 + t.seed) * 0.045 + t.pop * 0.25;
  var w = SPR.size * sc;
  ctx.drawImage(spr, x - w * 0.5, y - w * 0.5, w, w);
}

function paintBugSprite(g, R) {
  var ctx = g;
  var r = R;
  var pulse = 0.5;
  ctx.save();
  ctx.translate(0, 0);

  // 危险光晕（脉冲闪烁）
  var gg = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.7);
  gg.addColorStop(0, 'rgba(255,60,90,' + (0.42 + pulse * 0.36) + ')');
  gg.addColorStop(1, 'rgba(180,20,80,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(0, 0, r * 2.7, 0, 6.2832); ctx.fill();

  // 十字警示环
  ctx.strokeStyle = 'rgba(255,120,140,' + (0.25 + pulse * 0.45) + ')';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.45, 0, 6.2832); ctx.stroke();

  // 球体
  var bg = ctx.createRadialGradient(-r * 0.3, -r * 0.34, r * 0.15, 0, 0, r);
  bg.addColorStop(0, '#ff9aa8');
  bg.addColorStop(0.45, '#e8355a');
  bg.addColorStop(1, '#6a0f3c');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();

  // 虫子图标
  ctx.fillStyle = 'rgba(30,0,20,0.82)';
  ctx.beginPath(); ctx.ellipse(0, 1.5, r * 0.42, r * 0.56, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -r * 0.56, r * 0.30, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(30,0,20,0.82)';
  ctx.lineWidth = Math.max(1.4, r * 0.11);
  ctx.lineCap = 'round';
  for (var i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.32, r * 0.1 + i * r * 0.42);
    ctx.lineTo(-r * 0.86, r * 0.02 + i * r * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.32, r * 0.1 + i * r * 0.42);
    ctx.lineTo(r * 0.86, r * 0.02 + i * r * 0.55);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-r * 0.16, -r * 0.78); ctx.lineTo(-r * 0.52, -r * 1.14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r * 0.16, -r * 0.78); ctx.lineTo(r * 0.52, -r * 1.14); ctx.stroke();
  // 眼点
  ctx.fillStyle = '#ffd0d8';
  ctx.beginPath(); ctx.arc(-r * 0.12, -r * 0.60, r * 0.09, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.12, -r * 0.60, r * 0.09, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawBug(b, alpha) {
  var x = lerp(b.px, b.x, alpha), y = lerp(b.py, b.y, alpha);
  var pulse = 0.5 + 0.5 * Math.sin(TIME * 6.2 + b.seed);
  var w = SPR.size * (1 + pulse * 0.09);
  ctx.drawImage(SPR.bug, x - w * 0.5, y - w * 0.5, w, w);
}

function drawParticles(alpha) {
  particlePool.each(function (p) {
    var a = clamp(p.life / p.maxLife, 0, 1);
    var x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha);
    ctx.save();
    ctx.globalAlpha = a;
    if (p.kind === 2) {
      ctx.fillStyle = p.col;
      ctx.font = '900 ' + p.size + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = p.col; ctx.shadowBlur = 12;
      ctx.fillText(p.text, x, y);
    } else {
      ctx.fillStyle = p.col;
      if (p.kind === 1) {
        ctx.translate(x, y); ctx.rotate(p.rot);
        ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
      } else {
        ctx.beginPath(); ctx.arc(x, y, p.size * (0.35 + a * 0.65), 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();
  });
}

/* ==========================================================================
 * 12. 生成系统 —— 节奏模板 + 随机扰动 + 安全通道
 * ========================================================================== */
function activeBugsAt(x) {
  var n = 0;
  bugPool.each(function (b) { if (Math.abs(b.x - x) < 46) n++; });
  return n;
}
function bugBlocked(x, y, r) {
  var blocked = false;
  bugPool.each(function (b) {
    if (blocked) return;
    if (Math.abs(b.x - x) < 42 && Math.abs(b.y - y) < r + b.r + 8) blocked = true;
  });
  return blocked;
}
function spawnToken(x, y, forceHit) {
  if (tokenPool.count() >= CONFIG.MAX_TOKEN_ON_SCREEN) return;
  var t = tokenPool.obtain();
  if (!t) return;
  y = clamp(y, CONFIG.ITEM_TOP, CONFIG.ITEM_BOTTOM);
  t.x = t.px = x; t.y = t.py = y;
  t.r = CONFIG.TOKEN_R;
  t.seed = rnd(0, 6.2832);
  t.spin = rnd(0, 6.2832);
  t.pop = 0;
  var chance = CONFIG.HIT_CHANCE_BASE * (phase.peak ? CONFIG.PEAK_HIT : CONFIG.VALLEY_HIT);
  if (play.elapsed < CONFIG.EASY_HIT_TIME) chance = 1.0;   // 开局正反馈
  t.hit = (forceHit || heat.active) ? true : (Math.random() < chance);
  t.hot = heat.active;
  return t;
}
function spawnBug(x, y) {
  if (bugPool.count() >= CONFIG.MAX_BUG_ON_SCREEN) return;
  if (y < CONFIG.ITEM_TOP - 20 || y > CONFIG.ITEM_BOTTOM + 20) return;
  if (bugBlocked(x, y, CONFIG.BUG_R)) return;
  var b = bugPool.obtain();
  if (!b) return;
  b.x = b.px = x; b.y = b.py = y;
  b.r = CONFIG.BUG_R;
  b.seed = rnd(0, 6.2832);
  b.pulse = 0;
}

function spawnBeat() {
  var half = corridorHalf();
  var minY = CONFIG.ITEM_TOP + half;
  var maxY = CONFIG.ITEM_BOTTOM - half;
  var spawnX = CONFIG.W + 70;

  /* --- 1) 推进安全通道中心（有界随机游走，保证可达） --- */
  if (Math.random() < 0.86 && maxY > minY) {
    var step = Math.min(CONFIG.PATH_STEP_MAX, CONFIG.PATH_STEP_BASE + play.lvl * CONFIG.PATH_STEP_ADD);
    var target = rnd(minY, maxY);
    play.pathY = clamp(clamp(target, play.pathY - step, play.pathY + step), minY, maxY);
  }
  var py = play.pathY;

  /* --- 2) Token：沿安全通道分布（带偏差），按峰谷密度决定数量 --- */
  var dens = phaseTokenMult();
  var nTok = clamp(Math.round(rnd(1, 2.3) * dens), 1, 4);
  var tpl = pick(['line', 'line', 'arc', 'diag', 'single', 'double']);
  var usable = Math.max(6, half - CONFIG.TOKEN_R - 2);
  var i, ty;
  for (i = 0; i < nTok; i++) {
    if (tpl === 'line') ty = py + (i - (nTok - 1) / 2) * 46;
    else if (tpl === 'arc') ty = py + Math.sin((i / Math.max(1, nTok - 1)) * Math.PI) * (usable * 0.85) - usable * 0.42;
    else if (tpl === 'diag') ty = py - usable * 0.6 + i * (usable * 1.2 / Math.max(1, nTok - 1));
    else if (tpl === 'double') ty = py + (i % 2 === 0 ? -32 : 32);
    else ty = py;
    ty = clamp(ty, py - usable, py + usable);
    spawnToken(spawnX + (tpl === 'diag' ? i * -14 : 0), ty, false);
  }

  /* --- 3) Bug：只放在安全通道之外的风险区 --- */
  if (play.elapsed > CONFIG.GRACE_TIME) {
    var rate = bugRateBase() * phaseBugMult();
    var nBug = 0, guard = 0;
    while (Math.random() < rate * 0.55 && nBug < 3 && guard++ < 8) nBug++;
    // 闸门模板：通道上下各一个 Bug，形成 Flappy 式窄门
    if (nBug >= 1 && Math.random() < gateChance()) {
      spawnBug(spawnX, py - half - CONFIG.BUG_R - 12);
      spawnBug(spawnX, py + half + CONFIG.BUG_R + 12);
      return;
    }
    for (i = 0; i < nBug; i++) {
      var upperTop = CONFIG.ITEM_TOP;
      var upperBot = py - half - CONFIG.BUG_R - 10;
      var lowerTop = py + half + CONFIG.BUG_R + 10;
      var lowerBot = CONFIG.ITEM_BOTTOM;
      var upOk = upperBot > upperTop + 4;
      var loOk = lowerBot > lowerTop + 4;
      if (!upOk && !loOk) break;
      var useUp = upOk && (!loOk || Math.random() < 0.5);
      var by = useUp ? rnd(upperTop, upperBot) : rnd(lowerTop, lowerBot);
      spawnBug(spawnX + rnd(-8, 8), by);
    }
  }
}

/* ==========================================================================
 * 13. 事件：吃 Token / 撞 Bug / 缓存热 / 峰谷
 * ========================================================================== */
function startHeat() {
  heat.active = true;
  heat.timer = rnd(CONFIG.HEAT_TIME_MIN, CONFIG.HEAT_TIME_MAX);
  heat.burst = 1;
  // 清除场上已有 MISS Token：统一转化为 HIT
  tokenPool.each(function (t) {
    if (!t.hit) {
      t.hit = true; t.hot = true; t.pop = 0.6;
      burst(t.x, t.y, 4, { pal: 'gold', spMax: 120, lifeMax: 0.5, sizeMax: 4 });
    }
    t.hot = true;
  });
  ringBurst(fish.x + 6, fish.y, 24, 'gold', 1.0);
  burst(fish.x + 6, fish.y, 26, { pal: 'gold', spMin: 90, spMax: 320, lifeMin: 0.5, lifeMax: 1.1 });
  play.flash = Math.max(play.flash, 0.5);
  Audio2.sfxHeatOn();
  floatText(fish.x + 10, fish.y - 60, '缓存热 HIT!', '#ffd76a', 26);
}
function endHeat() {
  heat.active = false;
  heat.streak = 0;
  heat.tail = CONFIG.HEAT_TAIL;
  tokenPool.each(function (t) { t.hot = false; });
  ringBurst(fish.x + 6, fish.y, 14, 'gold', 0.7);
  Audio2.sfxHeatOff();
  floatText(fish.x + 10, fish.y - 60, '缓存热结束', '#ffd0a0', 20);
}

function onHitToken(t) {
  play.hitCount++;
  play.combo++;
  if (play.combo > play.maxCombo) play.maxCombo = play.combo;
  if (heat.tail > 0) heat.tail--; else heat.streak++;
  var mult = comboMult();
  var gain = CONFIG.SCORE_HIT * mult;
  play.score += gain;
  fish.mouth = 1;
  burst(t.x, t.y, 11, { pal: heat.active ? 'gold' : 'hit', spMin: 70, spMax: 250, lifeMax: 0.75 });
  burst(t.x, t.y, 4, { pal: heat.active ? 'gold' : 'hit', kind: 1, spMin: 40, spMax: 160, lifeMax: 0.6, sizeMax: 4 });
  floatText(t.x, t.y - 14, '+' + gain, mult >= 3 ? '#ffd76a' : '#a8f0ff', mult >= 4 ? 26 : 21);
  if (mult >= 2) floatText(t.x + 30, t.y + 16, mult + '×', '#ffd76a', 16);
  Audio2.sfxHit(play.combo);
  if (!heat.active && heat.streak >= heatThreshold()) startHeat();
}
function onMissToken(t) {
  play.missCount++;
  play.combo = 0;
  heat.streak = 0;
  burst(t.x, t.y, 7, { pal: 'miss', spMin: 20, spMax: 110, lifeMax: 0.7, g: 130 });
  floatText(t.x, t.y - 12, 'MISS', '#aab4c4', 18);
  Audio2.sfxMiss();
}

function shake(v) { play.shake = Math.min(26, play.shake + v); }

function endGame() {
  if (state !== S.PLAYING) return;
  state = S.GAMEOVER;
  play.overLock = 0.75;
  fish.dead = true;
  fish.vy = -240;
  shake(22);
  play.flash = 0.85;
  burst(fish.x, fish.y, 34, { pal: 'bug', spMin: 90, spMax: 400, lifeMin: 0.5, lifeMax: 1.2 });
  ringBurst(fish.x, fish.y, 18, 'bug', 0.9);
  Audio2.sfxCrash();
  Audio2.setIntensity(false);

  var total = play.hitCount + play.missCount;
  var rate = total > 0 ? play.hitCount / total : 0;
  var isRecord = play.score > Store.best;
  if (play.score > Store.best) Store.best = play.score;
  if (play.maxCombo > Store.bestCombo) Store.bestCombo = play.maxCombo;
  if (total >= 8 && rate > Store.bestRate) Store.bestRate = rate;
  Store.save();

  UI.overTitle.textContent = play.score >= 300 ? '缓存雪崩！' : (play.score >= 120 ? '连接中断' : '缓存击穿！');
  UI.ovScore.textContent = String(Math.round(play.score));
  UI.ovCombo.textContent = String(play.maxCombo);
  UI.ovRate.textContent = (rate * 100).toFixed(1) + '%';
  UI.ovBest.textContent = String(Math.round(Store.best));
  UI.ovRecord.textContent = isRecord ? '★ 新纪录！ ★' : '';
  refreshMenuBest();
  syncUI();
}

function refreshMenuBest() {
  UI.bestScore.textContent = String(Math.round(Store.best));
  UI.bestCombo.textContent = String(Math.round(Store.bestCombo));
  UI.bestRate.textContent = Store.bestRate > 0 ? (Store.bestRate * 100).toFixed(1) + '%' : '--';
}

/* ==========================================================================
 * 14. 状态机与 UI 同步
 * ========================================================================== */
function syncUI() {
  UI.menu.classList.toggle('on', state === S.MENU);
  UI.pause.classList.toggle('on', state === S.PAUSED);
  UI.over.classList.toggle('on', state === S.GAMEOVER);
  UI.btnPause.style.display = (state === S.PLAYING || state === S.PAUSED) ? 'flex' : 'none';
  UI.btnMute.textContent = Store.muted ? '✕' : '♪';
  UI.btnMute2.textContent = '静音：' + (Store.muted ? '开' : '关');
}

function resetGame() {
  tokenPool.clear(); bugPool.clear(); particlePool.clear();
  play.elapsed = 0; play.score = 0; play.combo = 0; play.maxCombo = 0;
  play.hitCount = 0; play.missCount = 0;
  play.spawnTimer = 0.7; play.pathY = CONFIG.H * 0.46; play.lvl = 0;
  play.levelPulse = 0; play.overLock = 0; play.inputLock = 0;
  play.lastInput = -99; play.scroll = 0; play.shake = 0; play.flash = 0;
  fish.x = CONFIG.FISH_X; fish.y = CONFIG.H * 0.46;
  fish.px = fish.x; fish.py = fish.y;
  fish.vy = 0; fish.tilt = 0; fish.dead = false; fish.spin = 0;
  fish.aura = 0; fish.mouth = 0;
  heat.active = false; heat.timer = 0; heat.streak = 0; heat.tail = 0; heat.burst = 0;
  phase.peak = false; phase.mix = 0; phase.timer = rnd(6, 9); phase.flash = 0;
  Audio2.setPhase(false);
  // 开局友好：一条 Token 直线
  play.pathY = fish.y;
  for (var i = 0; i < 3; i++) spawnToken(CONFIG.W + 120 + i * 74, fish.y + (i - 1) * 10, true);
}

function startGame() {
  resetGame();
  state = S.PLAYING;
  Audio2.unlock();
  Audio2.setIntensity(true);
  syncUI();
}
function toMenu() {
  state = S.MENU;
  tokenPool.clear(); bugPool.clear(); particlePool.clear();
  fish.dead = false; fish.vy = 0; fish.y = CONFIG.H * 0.46;
  fish.px = fish.x; fish.py = fish.y;
  Audio2.setIntensity(false);
  refreshMenuBest();
  syncUI();
}
function pauseGame() {
  if (state !== S.PLAYING) return;
  state = S.PAUSED;
  Audio2.setIntensity(false);
  syncUI();
}
function resumeGame() {
  if (state !== S.PAUSED) return;
  state = S.PLAYING;
  play.inputLock = 0.18;
  Audio2.unlock();
  Audio2.setIntensity(true);
  syncUI();
}
function toggleMute() {
  Store.muted = !Store.muted;
  Store.save();
  Audio2.setMuted(Store.muted);
  Audio2.sfxUI();
  syncUI();
}

/* ==========================================================================
 * 15. 输入
 * ========================================================================== */
function flap() {
  var now = TIME;
  if (now - play.lastInput < CONFIG.INPUT_CD) return;
  play.lastInput = now;
  fish.vy = -CONFIG.JUMP_V;
  fish.mouth = 1;
  Audio2.sfxFlap();
  burst(fish.x - 22, fish.y + 12, 3, { pal: 'valley', spMin: 20, spMax: 70, g: 90, lifeMax: 0.42, sizeMax: 4 });
}

function doAction() {
  Audio2.unlock();
  if (play.inputLock > 0) return;
  if (state === S.MENU) { startGame(); return; }
  if (state === S.TUTORIAL) { Store.tutorialDone = true; Store.save(); startGame(); return; }
  if (state === S.PLAYING) { flap(); return; }
  if (state === S.GAMEOVER) {
    if (play.overLock > 0) return;
    startGame(); return;
  }
}

function onPointerDown(e) {
  if (e.target && e.target.tagName === 'BUTTON') return;   // 按钮自行处理，避免误触发拍翅
  if (e.cancelable) e.preventDefault();
  doAction();
}
stage.addEventListener('pointerdown', onPointerDown, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  if (e.repeat) {
    if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault();
    return;
  }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (state === S.PAUSED) return;
    doAction();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (state === S.PLAYING) pauseGame();
    else if (state === S.PAUSED) resumeGame();
  } else if (e.code === 'KeyM') {
    toggleMute();
  }
}, { passive: false });

/* 按钮绑定 */
function bind(id, fn) {
  var el = document.getElementById(id);
  el.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); Audio2.unlock(); fn(); });
  el.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
}
bind('btnStart', startGame);
bind('btnHow', function () { Audio2.sfxUI(); state = S.TUTORIAL; syncUI(); });
bind('btnResume', resumeGame);
bind('btnRestart', startGame);
bind('btnMute2', toggleMute);
bind('btnMenu', toMenu);
bind('btnAgain', startGame);
bind('btnMenu2', toMenu);
bind('btnMute', toggleMute);
bind('btnPause', function () { if (state === S.PLAYING) pauseGame(); else if (state === S.PAUSED) resumeGame(); });

document.addEventListener('visibilitychange', function () {

});

/* ==========================================================================
 * 16. 更新（固定步长）
 * ========================================================================== */
function updatePhase(dt) {
  phase.timer -= dt;
  if (phase.timer <= 0) {
    phase.peak = !phase.peak;
    phase.timer = rnd(phaseMin(), phaseMax());
    phase.flash = 1;
    Audio2.setPhase(phase.peak);
    Audio2.sfxPhase(phase.peak);
    ringBurst(CONFIG.W * 0.5, 40, 16, phase.peak ? 'peak' : 'valley', 0.9);
    floatText(CONFIG.W * 0.5, 96, phase.peak ? '峰时 PEAK' : '谷时 VALLEY',
              phase.peak ? '#ff8bc0' : '#7ff0ff', 24);
  }
  phase.mix = moveToward(phase.mix, phase.peak ? 1 : 0, dt / CONFIG.PHASE_FADE);
  if (phase.flash > 0) phase.flash = Math.max(0, phase.flash - dt * 1.4);
}

function updateFish(dt) {
  fish.px = fish.x; fish.py = fish.y;
  if (state === S.PLAYING) {
    fish.vy += gravityNow() * dt;
    if (fish.vy > CONFIG.MAX_FALL) fish.vy = CONFIG.MAX_FALL;
    fish.y += fish.vy * dt;
    if (fish.y < CONFIG.FIELD_TOP) { fish.y = CONFIG.FIELD_TOP; if (fish.vy < 0) fish.vy = 0; }
    if (fish.y > CONFIG.FIELD_BOTTOM) { fish.y = CONFIG.FIELD_BOTTOM; if (fish.vy > 0) fish.vy = 0; }
    fish.tilt = moveToward(fish.tilt, clamp(fish.vy / 760, -1, 1) * CONFIG.TILT_MAX, dt * 3.4);
  } else if (state === S.GAMEOVER) {
    fish.vy += 1100 * dt;
    fish.y += fish.vy * dt;
    fish.spin += dt * 3.4;
    if (fish.y > CONFIG.FIELD_BOTTOM + 40) { fish.y = CONFIG.FIELD_BOTTOM + 40; fish.vy = 0; }
  }
  fish.tail += dt * (6.5 + Math.min(7, Math.abs(fish.vy) / 110));
  if (fish.blink > 0) fish.blink -= dt * 6;
  else if (Math.random() < dt * 0.22) fish.blink = 1;
  if (fish.mouth > 0) fish.mouth = Math.max(0, fish.mouth - dt * 3.4);
  var targetAura = heat.active ? 1 : 0;
  fish.aura = moveToward(fish.aura, targetAura, dt * 2.6);
}

function updateEntities(dt) {
  var spd = worldSpeed();
  play.scroll += spd * dt;
  tokenPool.each(function (t) {
    t.px = t.x; t.py = t.y;
    t.x -= spd * dt;
    t.spin += dt * 1.6;
    if (t.pop > 0) t.pop = Math.max(0, t.pop - dt * 4);
    if (t.x < -70) tokenPool.release(t);
  });
  bugPool.each(function (b) {
    b.px = b.x; b.py = b.y;
    b.x -= spd * dt;
    if (b.x < -70) bugPool.release(b);
  });
}

function collide() {
  var fx = fish.x, fy = fish.y, fr = CONFIG.FISH_HIT_R;   // 碰撞圆心 = 精灵锚点（脸部中心）
  tokenPool.each(function (t) {
    var dx = t.x - fx, dy = t.y - fy;
    var rr2 = (fr + t.r - 5);
    if (dx * dx + dy * dy <= rr2 * rr2) {
      if (t.hit) onHitToken(t); else onMissToken(t);
      tokenPool.release(t);
    }
  });
  bugPool.each(function (b) {
    var dx = b.x - fx, dy = b.y - fy;
    var rr2 = (fr + b.r - 7);
    if (dx * dx + dy * dy <= rr2 * rr2) {
      bugPool.release(b);
      endGame();
    }
  });
}

function updateHeat(dt) {
  if (!heat.active) return;
  heat.timer -= dt;
  fish.aura = Math.min(1, fish.aura + dt * 3);
  if (Math.random() < dt * 14) {
    var t = tokenPool.items[(Math.random() * tokenPool.items.length) | 0];
    if (t.active && t.hit) burst(t.x, t.y, 1, { pal: 'gold', spMax: 60, lifeMax: 0.5, sizeMax: 3 });
  }
  if (heat.timer <= 0) endHeat();
}

function update(dt) {
  if (state === S.PAUSED) return;         // 暂停：世界、计时器、粒子、背景全部冻结
  TIME += dt;
  updatePhase(dt);
  updateFish(dt);

  if (state === S.PLAYING) {
    play.elapsed += dt;
    // 难度：每 30 秒一级，10 级封顶
    var nl = Math.min(CONFIG.LEVEL_MAX - 1, Math.floor(play.elapsed / CONFIG.LEVEL_TIME));
    if (nl > play.lvl) {
      play.lvl = nl;
      play.levelPulse = 1;
      Audio2.sfxLevel();
      floatText(CONFIG.W - 130, 120, '难度 ' + (nl + 1), '#ffb0d8', 20);
    }
    if (play.levelPulse > 0) play.levelPulse = Math.max(0, play.levelPulse - dt * 0.9);

    play.inputLock = Math.max(0, play.inputLock - dt);
    play.spawnTimer -= dt;
    if (play.spawnTimer <= 0) {
      spawnBeat();
      var interval = spawnIntBase();
      play.spawnTimer = interval * rnd(0.86, 1.16);
    }
    updateEntities(dt);
    collide();
    updateHeat(dt);
  } else if (state === S.GAMEOVER) {
    play.overLock = Math.max(0, play.overLock - dt);
    play.scroll += 40 * dt;
    updateEntities2Slow(dt);
  } else if (state === S.MENU || state === S.TUTORIAL) {
    // MENU / TUTORIAL：背景缓慢流动，不推进世界
    play.scroll += 26 * dt;
  }

  updateParticles(dt);
  if (play.shake > 0) play.shake = Math.max(0, play.shake - dt * 46);
  if (play.flash > 0) play.flash = Math.max(0, play.flash - dt * 1.6);
}

/* 结算时世界缓慢减速漂移（保持动感但不再生成） */
function updateEntities2Slow(dt) {
  var spd = 40;
  tokenPool.each(function (t) { t.px = t.x; t.py = t.y; t.x -= spd * dt; if (t.x < -70) tokenPool.release(t); });
  bugPool.each(function (b) { b.px = b.x; b.py = b.y; b.x -= spd * dt; if (b.x < -70) bugPool.release(b); });
}

/* ==========================================================================
 * 17. 渲染
 * ========================================================================== */
function drawHUD() {
  ctx.save();
  // 左上角 HUD 底板：角色可能贴顶飞过此处，加一层渐变底保证可读性
  var pg = ctx.createLinearGradient(0, 0, 0, 156);
  pg.addColorStop(0, 'rgba(6,12,28,0.60)');
  pg.addColorStop(1, 'rgba(6,12,28,0)');
  ctx.fillStyle = pg;
  rr(ctx, 10, 8, 306, 150, 14);
  ctx.fill();

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  // 分数
  ctx.font = '900 38px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText(String(Math.round(play.score)), 26, 52);
  ctx.fillStyle = '#eaf2ff';
  ctx.shadowColor = 'rgba(90,140,255,0.9)'; ctx.shadowBlur = 14;
  ctx.fillText(String(Math.round(play.score)), 24, 50);
  ctx.shadowBlur = 0;

  // 连击
  var mult = comboMult();
  ctx.font = '700 19px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = play.combo > 0 ? (mult >= 4 ? '#ffd76a' : (mult >= 2 ? '#9fe8ff' : '#cfe0ff')) : '#7b8cab';
  ctx.fillText('连击 ' + play.combo + (play.combo > 0 ? '   ×' + mult : ''), 25, 76);

  // 命中率
  var total = play.hitCount + play.missCount;
  var rate = total > 0 ? play.hitCount / total : 0;
  ctx.font = '600 15px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = '#93a9d4';
  ctx.fillText('缓存命中率 ' + (total > 0 ? (rate * 100).toFixed(0) + '%' : '--') +
               '   HIT ' + play.hitCount + ' / MISS ' + play.missCount, 26, 100);

  // 缓存热进度条
  var hw = 150, hh = 7, hx = 26, hy = 110;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(ctx, hx, hy, hw, hh, 3.5); ctx.fill();
  var prog = heat.active ? 1 : clamp(heat.streak / heatThreshold(), 0, 1);
  var hg = ctx.createLinearGradient(hx, 0, hx + hw, 0);
  if (heat.active) { hg.addColorStop(0, '#ffe9a8'); hg.addColorStop(1, '#ff9b2f'); }
  else { hg.addColorStop(0, '#4de1ff'); hg.addColorStop(1, '#4D6BFE'); }
  ctx.fillStyle = hg;
  rr(ctx, hx, hy, Math.max(3, hw * prog), hh, 3.5); ctx.fill();
  ctx.font = '700 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = heat.active ? '#ffd76a' : '#7f93bb';
  ctx.fillText(heat.active ? 'CACHE HOT' : '缓存热 ' + heat.streak + '/' + heatThreshold(), hx + hw + 8, hy + 7);

  ctx.restore();

  // 顶部峰谷横幅
  var bw = 232, bh = 36, bx = CONFIG.W / 2 - bw / 2, by = 14;
  ctx.save();
  ctx.globalAlpha = 0.92;
  var bgr = ctx.createLinearGradient(bx, by, bx, by + bh);
  if (phase.peak) { bgr.addColorStop(0, 'rgba(120,20,70,0.92)'); bgr.addColorStop(1, 'rgba(60,8,50,0.92)'); }
  else { bgr.addColorStop(0, 'rgba(10,60,90,0.92)'); bgr.addColorStop(1, 'rgba(6,28,52,0.92)'); }
  ctx.fillStyle = bgr;
  rr(ctx, bx, by, bw, bh, bh / 2); ctx.fill();
  ctx.lineWidth = 2 + phase.flash * 3;
  ctx.strokeStyle = phase.peak ? 'rgba(255,120,190,' + (0.5 + phase.flash * 0.5) + ')'
                               : 'rgba(110,240,255,' + (0.5 + phase.flash * 0.5) + ')';
  rr(ctx, bx, by, bw, bh, bh / 2); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 19px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = phase.peak ? '#ffb8dc' : '#a8f4ff';
  ctx.shadowColor = phase.peak ? 'rgba(255,80,160,0.9)' : 'rgba(80,230,255,0.9)';
  ctx.shadowBlur = 12;
  ctx.fillText(phase.peak ? '峰 时 PEAK' : '谷 时 VALLEY', bx + bw * 0.42, by + bh / 2 + 1);
  ctx.shadowBlur = 0;
  ctx.font = '700 16px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = '#e6f2ff';
  ctx.fillText(phase.timer.toFixed(1) + 's', bx + bw - 34, by + bh / 2 + 1);

  // 缓存热状态副横幅
  if (heat.active) {
    ctx.font = '900 15px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rr(ctx, CONFIG.W / 2 - 92, by + bh + 6, 184, 26, 13); ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,110,0.9)'; ctx.lineWidth = 1.6;
    rr(ctx, CONFIG.W / 2 - 92, by + bh + 6, 184, 26, 13); ctx.stroke();
    ctx.fillStyle = '#ffd76a';
    ctx.shadowColor = 'rgba(255,190,60,1)'; ctx.shadowBlur = 12;
    ctx.fillText('★ 缓存热 ' + heat.timer.toFixed(1) + 's · 必定命中', CONFIG.W / 2, by + bh + 19);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawTutorial() {
  // 半透明遮罩
  ctx.save();
  ctx.fillStyle = 'rgba(4,8,20,0.74)';
  ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);

  // 演示元素（复用预分配对象，避免每帧分配）
  drawToken(DEMO.hit, 1);
  drawToken(DEMO.miss, 1);
  drawBug(DEMO.bug, 1);
  drawFish(352, 226, 0, 1.3, 'idle');

  // 标注
  function tag(tx, ty, text, col, ax, ay) {
    ctx.save();
    ctx.font = '700 17px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    var w = ctx.measureText(text).width + 26;
    ctx.fillStyle = 'rgba(10,18,40,0.9)';
    rr(ctx, tx, ty - 16, w, 32, 16); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = col;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, tx + 13, ty);
    if (ax !== undefined) {
      ctx.strokeStyle = col; ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(ax > tx + w ? tx + w : (ax < tx ? tx : ax), ty);
      ctx.lineTo(ax, ay);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 40px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = '#eaf2ff';
  ctx.shadowColor = 'rgba(80,130,255,0.9)'; ctx.shadowBlur = 22;
  ctx.fillText('玩法说明', CONFIG.W / 2, 62);
  ctx.shadowBlur = 0;

  tag(36, 300, '① 点击 / 触摸 / 空格 让大肥鱼向上', '#8fd8ff', 300, 250);
  tag(560, 96, '② 吃 HIT Token 得分，连击提升倍率', '#7ff0c8', 700, 150);
  tag(430, 236, '③ MISS 会断连击（不会死）', '#c3cad8', 640, 300);
  tag(520, 380, '④ 避开 Bug，碰到立即结束', '#ff8fa8', 760, 440);
  tag(566, 480, '⑤ 顶部横幅提示峰时 / 谷时切换', '#ffb8dc', 620, 34);

  var blink = 0.6 + 0.4 * Math.sin(TIME * 4);
  ctx.globalAlpha = blink;
  ctx.font = '900 24px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = '#ffd76a';
  ctx.shadowColor = 'rgba(255,190,60,1)'; ctx.shadowBlur = 18;
  ctx.fillText('点击任意位置开始游戏', CONFIG.W / 2, CONFIG.H - 30);
  ctx.restore();
}

function drawMenuScene() {
  var bob = Math.sin(TIME * 1.7) * 9;
  var rot = Math.sin(TIME * 1.35) * 0.06;
  drawFish(CONFIG.W * 0.5, CONFIG.H * 0.47 + bob, rot, 1.55, 'idle');
  // 环绕的小 Token（复用预分配对象）
  for (var i = 0; i < DEMO.orbit.length; i++) {
    var a = TIME * 0.7 + i * 2.09;
    var t = DEMO.orbit[i];
    t.px = t.x; t.py = t.y;
    t.x = CONFIG.W * 0.5 + Math.cos(a) * 252;
    t.y = CONFIG.H * 0.47 + Math.sin(a) * 168 + bob * 0.4;
    drawToken(t, 1);
  }
}

function render(alpha) {
  var s = view.dprScale;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.globalAlpha = 1;

  drawBackground(alpha, 0);

  // 屏幕震动
  var shx = 0, shy = 0;
  if (play.shake > 0.2) {
    shx = (Math.random() * 2 - 1) * play.shake;
    shy = (Math.random() * 2 - 1) * play.shake;
  }
  ctx.save();
  ctx.translate(shx, shy);

  if (state === S.MENU) {
    drawMenuScene();
  } else if (state === S.TUTORIAL) {
    drawParticles(alpha);
  } else {
    // Token
    tokenPool.each(function (t) { drawToken(t, alpha); });
    // 鱼
    var fx = lerp(fish.px, fish.x, alpha);
    var fy = lerp(fish.py, fish.y, alpha);
    if (state === S.GAMEOVER) {
      drawFish(fx, fy, fish.spin, 1.0, 'dead');
    } else {
      var bob = state === S.MENU ? 0 : Math.sin(TIME * 6) * 1.2;
      drawFish(fx, fy + bob, fish.tilt, 1.0, state === S.PLAYING ? 'play' : 'idle');
    }
    // Bug（画在鱼之上更醒目）
    bugPool.each(function (b) { drawBug(b, alpha); });
    drawParticles(alpha);
  }
  ctx.restore();

  if (state === S.PLAYING || state === S.PAUSED) drawHUD();
  if (state === S.TUTORIAL) drawTutorial();

  // 难度提升时屏幕边缘脉冲
  if (play.levelPulse > 0.01) {
    ctx.save();
    ctx.globalAlpha = play.levelPulse * 0.55;
    ctx.strokeStyle = '#ff9ad0';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, CONFIG.W - 10, CONFIG.H - 10);
    ctx.restore();
  }
  // 事件闪光
  if (play.flash > 0.01) {
    ctx.save();
    ctx.globalAlpha = play.flash * 0.35;
    ctx.fillStyle = heat.active ? '#ffd76a' : '#ff4d6d';
    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
    ctx.restore();
  }
  if (state === S.PAUSED) {
    ctx.save();
    ctx.fillStyle = 'rgba(4,8,20,0.55)';
    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
    ctx.restore();
  }
  // 暗角
  if (quality >= 1) {
    ctx.save();
    var vg = ctx.createRadialGradient(CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.42,
                                      CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.92);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
    ctx.restore();
  }
}

/* ==========================================================================
 * 18. 主循环：rAF + 固定步长累加器 + 渲染插值
 * ========================================================================== */
var acc = 0, last = 0;
var fpsFrames = 0, fpsTime = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > CONFIG.MAX_FRAME) dt = CONFIG.MAX_FRAME;
  if (dt < 0) dt = 0;

  acc += dt;
  var guard = 0;
  while (acc >= CONFIG.FIXED && guard++ < 5) {
    update(CONFIG.FIXED);
    acc -= CONFIG.FIXED;
  }
  if (guard >= 5) acc = 0;

  render(acc / CONFIG.FIXED);

  Audio2.tick();

  /* --- 性能自适应降级 --- */
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 1) {
    var fps = fpsFrames / fpsTime;
    fpsFrames = 0; fpsTime = 0;
    if (fps < 45) {
      lowFpsTime += 1;
      if (lowFpsTime >= 3 && quality > 0) {
        quality--;
        lowFpsTime = 0;
        // 降级时顺手回收多余粒子，减轻压力
        if (quality === 1) { /* 中等：减少背景层（渲染时已按 quality 分支） */ }
      }
    } else {
      lowFpsTime = Math.max(0, lowFpsTime - 0.5);
    }
  }
}

/* ==========================================================================
 * 19. 启动
 * ========================================================================== */
buildSprites();                 // Token / Bug 离屏精灵（仅一次）
buildFishGradients();           // 角色渐变（仅一次）
refreshMenuBest();
Audio2.setMuted(Store.muted);
syncUI();
if (!Store.tutorialDone) {
  // 首次进入：先展示教程，再开始
  state = S.TUTORIAL;
  syncUI();
}
resetGame();
requestAnimationFrame(frame);

/* ==========================================================================
 * 20. 调试 / 调参钩子（只读快照，不影响游戏逻辑；便于平衡性验证）
 * ========================================================================== */
window.__fatfish = {
  config: CONFIG,
  /* 已烘焙的 Token / Bug 精灵（调试用） */
  sprites: function () { return { hit: SPR.hit, miss: SPR.miss, hot: SPR.hot, bug: SPR.bug, size: SPR.size }; },
  /* 角色精灵加载状态（调试用） */
  hero: function () {
    return { ready: HERO.ready, failed: HERO.failed, w: HERO.w, h: HERO.h,
             drawH: HERO.drawH, ax: HERO.ax, ay: HERO.ay };
  },
  /* 当前场上实体快照（仅供调试 / 自动化验证，游戏逻辑不依赖它） */
  entities: function () {
    var out = { tokens: [], bugs: [] };
    tokenPool.each(function (t) { out.tokens.push({ x: t.x, y: t.y, hit: t.hit, hot: heat.active }); });
    bugPool.each(function (b) { out.bugs.push({ x: b.x, y: b.y }); });
    return out;
  },
  /* 峰谷持续时长曲线（调试用） */
  phaseWindowAt: function (t) { return { min: phaseMin(t), max: phaseMax(t) }; },
  snapshot: function () {
    return {
      state: state, score: Math.round(play.score), elapsed: play.elapsed, lvl: play.lvl,
      combo: play.combo, maxCombo: play.maxCombo, hit: play.hitCount, miss: play.missCount,
      heat: heat.active, heatStreak: heat.streak, peak: phase.peak, phaseMix: phase.mix,
      phaseTimer: phase.timer,
      quality: quality, scroll: play.scroll,
      tokens: { active: tokenPool.count(), free: tokenPool.free.length, size: tokenPool.size },
      bugs: { active: bugPool.count(), free: bugPool.free.length, size: bugPool.size },
      particles: { active: particlePool.count(), free: particlePool.free.length, size: particlePool.size },
      fish: { x: fish.x, y: fish.y, vy: fish.vy }
    };
  }
};

})();
</script>
